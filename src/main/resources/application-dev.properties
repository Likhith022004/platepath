# ===== Dev Profile Overrides =====

# ===== MySQL (dev) =====
spring.datasource.url=jdbc:mysql://localhost:3306/platepath_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kushal@79

# ===== JPA (dev) — more verbose =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf (dev) — disable cache =====
spring.thymeleaf.cache=false

# ===== DevTools =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===== Logging (dev) =====
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== CORS (dev — allow all for testing) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# ===== AI (dev — optional mock mode) =====
app.claude.mock-mode=false

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Login')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-sm" style="width:100%;max-width:420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-geo-alt-fill fs-1" style="color:var(--pp-orange)"></i>
                <h3 class="fw-bold mt-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to your PlatePath account</p>
            </div>
            <div id="alertBox" class="alert d-none" role="alert"></div>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required/>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3 text-end small">
                    <span class="text-muted">Demo: </span>
                    <a href="#" onclick="fill('admin@platepath.com')" class="text-decoration-none me-2">Admin</a>
                    <a href="#" onclick="fill('ananya@example.com')" class="text-decoration-none me-2">Customer</a>
                    <a href="#" onclick="fill('arjun@delivery.com')" class="text-decoration-none">Delivery</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold" id="loginBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="spinner"></span>
                    Sign In
                </button>
            </form>
            <hr/>
            <p class="text-center text-muted small mb-0">
                Don't have an account? <a href="/register" class="text-decoration-none fw-semibold">Register</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    if (localStorage.getItem('pp_token')) window.location.href = '/restaurants';

    function fill(email) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = 'pass123';
    }
    function togglePwd() {
        const p = document.getElementById('password');
        const i = document.getElementById('eyeIcon');
        p.type = p.type === 'password' ? 'text' : 'password';
        i.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
    function showAlert(msg, type='danger') {
        const a = document.getElementById('alertBox');
        a.className = `alert alert-${type}`;
        a.textContent = msg;
        a.classList.remove('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const spin = document.getElementById('spinner');
        btn.disabled = true; spin.classList.remove('d-none');
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (!res.ok) { showAlert(data.message || 'Invalid credentials'); return; }
            localStorage.setItem('pp_token', data.token);
            localStorage.setItem('pp_user', JSON.stringify({ name: data.name, email: data.email, role: data.role, id: data.userId }));
            const role = data.role;
            if (role === 'ADMIN')            window.location.href = '/admin/dashboard';
            else if (role === 'DELIVERY_BOY') window.location.href = '/delivery/panel';
            else if (role === 'RESTAURANT_OWNER') window.location.href = '/restaurant/manage';
            else window.location.href = '/restaurants';
        } catch (err) {
            showAlert('Network error. Please try again.');
        } finally {
            btn.disabled = false; spin.classList.add('d-none');
        }
    });
</script>
</body>
</html>

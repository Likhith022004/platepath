<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head('Checkout')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="flex-grow-1 py-5">
    <div class="container" style="max-width:800px">
        <h2 class="fw-bold mb-4"><i class="bi bi-bag-check me-2" style="color:var(--pp-orange)"></i>Checkout</h2>
        <div id="alertBox" class="alert d-none"></div>

        <div class="row g-4">
            <!-- Left: delivery details -->
            <div class="col-md-7">
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2"></i>Delivery Address</h6>
                        <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="Enter your delivery address"></textarea>
                    </div>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3"><i class="bi bi-chat-left-text me-2"></i>Special Instructions <span class="text-muted fw-normal">(optional)</span></h6>
                        <input type="text" class="form-control" id="specialInstructions" placeholder="E.g. Less spicy, no onions…"/>
                    </div>
                </div>
            </div>

            <!-- Right: order summary -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3"><i class="bi bi-receipt me-2"></i>Order Summary</h6>
                        <div id="summaryItems"></div>
                        <hr/>
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Subtotal</span><span id="subtotal">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Delivery fee</span><span>₹30</span>
                        </div>
                        <div class="d-flex justify-content-between fw-bold fs-5 mt-2">
                            <span>Total</span><span id="total">₹30</span>
                        </div>
                        <button class="btn btn-primary w-100 mt-3 fw-semibold" id="placeOrderBtn" onclick="placeOrder()">
                            <span class="spinner-border spinner-border-sm d-none me-2" id="placeSpinner"></span>
                            <i class="bi bi-check2-circle me-2"></i>Place Order
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<div th:replace="~{layout/base :: scripts}"></div>
<script>
    if (!isLoggedIn()) window.location.href = '/login?next=checkout';

    const cart = getCart();
    if (!cart.length) window.location.href = '/restaurants';

    // Pre-fill address from user profile
    const user = getUser();
    if (user?.address) document.getElementById('deliveryAddress').value = user.address;

    // Render summary
    function renderSummary() {
        const container = document.getElementById('summaryItems');
        const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
        container.innerHTML = cart.map(i =>
            `<div class="d-flex justify-content-between small mb-1">
                <span>${i.name} × ${i.qty}</span>
                <span>₹${(i.price*i.qty).toFixed(2)}</span>
            </div>`
        ).join('');
        document.getElementById('subtotal').textContent = '₹' + subtotal.toFixed(2);
        document.getElementById('total').textContent = '₹' + (subtotal + 30).toFixed(2);
    }
    renderSummary();

    async function placeOrder() {
        const address = document.getElementById('deliveryAddress').value.trim();
        if (!address) { showAlert('Please enter a delivery address.'); return; }

        const btn = document.getElementById('placeOrderBtn');
        const spin = document.getElementById('placeSpinner');
        btn.disabled = true; spin.classList.remove('d-none');

        const restaurantId = cart[0]?.restaurantId;
        const orderItems = cart.map(i => ({ menuItemId: i.id, quantity: i.qty }));
        const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);

        try {
            const res = await apiFetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    restaurantId,
                    items: orderItems,
                    deliveryAddress: address,
                    totalAmount: subtotal + 30,
                    specialInstructions: document.getElementById('specialInstructions').value.trim() || null
                })
            });
            if (!res || !res.ok) {
                const err = await res?.json();
                showAlert(err?.message || 'Failed to place order.'); return;
            }
            const order = await res.json();
            clearCart();
            window.location.href = `/orders/${order.id}/track`;
        } catch (e) {
            showAlert('Network error. Please try again.');
        } finally {
            btn.disabled = false; spin.classList.add('d-none');
        }
    }

    function showAlert(msg, type='danger') {
        const a = document.getElementById('alertBox');
        a.className = `alert alert-${type}`;
        a.textContent = msg;
        a.classList.remove('d-none');
        window.scrollTo(0,0);
    }
</script>
</body>
</html>

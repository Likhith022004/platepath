# ============================================================
# PlatePath — application.properties (final)
# ============================================================
spring.application.name=PlatePath
server.port=8080

# ===== Active Profile =====
spring.profiles.active=dev

# ===== MySQL Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/platepath_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Kushal@79

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ===== JWT =====
platepath.jwt.secret=PlatePathSuperSecretKeyForJWTTokenGeneration2025MustBe256BitsLong!!
platepath.jwt.expiration=86400000

# ===== AI (aicredits.in — Claude-compatible) =====
platepath.ai.api-key=sk-live-b4fd2abfe2cacde0c4303be4dab4aa3976c81446969e29d928884bccc503edfd
platepath.ai.base-url=https://api.aicredits.in

# ===== Google Maps =====
platepath.maps.api-key=YOUR_GOOGLE_MAPS_KEY_HERE

# ===== WebSocket =====
app.websocket.allowed-origins=http://localhost:8080,http://localhost:3000

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== SQL Seed Data =====
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ===== File upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Scheduling =====
spring.task.scheduling.pool.size=5

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

# ===== Logging =====
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.security=INFO

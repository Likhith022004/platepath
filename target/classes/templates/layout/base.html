<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:th-fragment="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | PlatePath'">PlatePath</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root { --pp-orange: #ff6b35; --pp-dark: #1a1a2e; }
        body { background-color: #f8f9fa; }
        .navbar-brand span { color: var(--pp-orange); }
        .btn-primary { background-color: var(--pp-orange); border-color: var(--pp-orange); }
        .btn-primary:hover { background-color: #e05a28; border-color: #e05a28; }
        .text-primary { color: var(--pp-orange) !important; }
        .badge-cart { position: absolute; top: -6px; right: -8px; font-size: .65rem; }
        .card-restaurant { transition: transform .2s, box-shadow .2s; cursor: pointer; }
        .card-restaurant:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
        .status-step { position: relative; text-align: center; flex: 1; }
        .status-step::before { content:''; position:absolute; top:20px; left:-50%; width:100%; height:3px; background:#dee2e6; z-index:0; }
        .status-step:first-child::before { display:none; }
        .status-step.active .step-icon { background-color: var(--pp-orange); color:#fff; }
        .status-step.done .step-icon { background-color: #198754; color:#fff; }
        .step-icon { width:42px; height:42px; border-radius:50%; background:#dee2e6; display:inline-flex; align-items:center; justify-content:center; position:relative; z-index:1; font-size:1.1rem; }
        .cart-sidebar { position: fixed; right: -380px; top: 0; width: 360px; height: 100vh; background:#fff; box-shadow:-4px 0 20px rgba(0,0,0,.15); transition: right .3s; z-index:1050; overflow-y:auto; }
        .cart-sidebar.open { right: 0; }
        .cart-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1040; }
        .cart-overlay.open { display:block; }
    </style>
</head>

<!-- Navbar fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--pp-dark);">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/restaurants">
            <i class="bi bi-geo-alt-fill me-1"></i>Plate<span>Path</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/restaurants"><i class="bi bi-shop me-1"></i>Restaurants</a></li>
                <li class="nav-item nav-orders d-none"><a class="nav-link" href="/orders/history"><i class="bi bi-bag me-1"></i>My Orders</a></li>
                <li class="nav-item nav-delivery d-none"><a class="nav-link" href="/delivery/panel"><i class="bi bi-bicycle me-1"></i>Deliveries</a></li>
                <li class="nav-item nav-admin d-none"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-1"></i>Admin</a></li>
                <li class="nav-item nav-owner d-none"><a class="nav-link" href="/restaurant/manage"><i class="bi bi-tools me-1"></i>My Restaurant</a></li>
            </ul>
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item nav-cart d-none">
                    <button class="btn btn-outline-light btn-sm position-relative" onclick="toggleCart()">
                        <i class="bi bi-cart3"></i>
                        <span class="badge bg-danger badge-cart" id="cartCount">0</span>
                    </button>
                </li>
                <li class="nav-item" id="navAuthButtons">
                    <a class="btn btn-outline-light btn-sm me-2" href="/login">Login</a>
                    <a class="btn btn-sm text-white" style="background:var(--pp-orange)" href="/register">Register</a>
                </li>
                <li class="nav-item d-none" id="navUserMenu">
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i><span id="navUserName">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text text-muted small" id="navUserEmail"></span></li>
                            <li><hr class="dropdown-divider"/></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Footer fragment -->
<footer th:fragment="footer" class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-1 fw-semibold"><i class="bi bi-geo-alt-fill text-warning me-1"></i>PlatePath</p>
        <p class="text-muted small mb-0">&copy; 2025 PlatePath. AI-powered food delivery.</p>
    </div>
</footer>

<!-- Scripts fragment -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
        // ── Auth helpers ──────────────────────────────────────────────
        function getToken()    { return localStorage.getItem('pp_token'); }
        function getUser()     { try { return JSON.parse(localStorage.getItem('pp_user')); } catch(e) { return null; } }
        function isLoggedIn()  { return !!getToken(); }
        function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }

        function logout() {
            localStorage.removeItem('pp_token');
            localStorage.removeItem('pp_user');
            window.location.href = '/login';
        }

        // ── Navbar role-based visibility ──────────────────────────────
        (function initNav() {
            const user = getUser();
            if (!user) return;
            document.getElementById('navAuthButtons').classList.add('d-none');
            document.getElementById('navUserMenu').classList.remove('d-none');
            document.getElementById('navUserName').textContent = user.name || 'User';
            document.getElementById('navUserEmail').textContent = user.email || '';

            const role = user.role || '';
            if (role === 'CUSTOMER')         { document.querySelectorAll('.nav-orders,.nav-cart').forEach(el => el.classList.remove('d-none')); }
            if (role === 'DELIVERY_BOY')     { document.querySelector('.nav-delivery').classList.remove('d-none'); }
            if (role === 'ADMIN')            { document.querySelector('.nav-admin').classList.remove('d-none'); }
            if (role === 'RESTAURANT_OWNER') { document.querySelector('.nav-owner').classList.remove('d-none'); }
        })();

        // ── Cart (localStorage) ───────────────────────────────────────
        function getCart()      { try { return JSON.parse(localStorage.getItem('pp_cart')) || []; } catch(e) { return []; } }
        function saveCart(c)    { localStorage.setItem('pp_cart', JSON.stringify(c)); updateCartBadge(); }
        function clearCart()    { localStorage.removeItem('pp_cart'); updateCartBadge(); }
        function updateCartBadge() {
            const c = getCart();
            const total = c.reduce((s, i) => s + i.qty, 0);
            document.querySelectorAll('#cartCount').forEach(el => el.textContent = total);
        }
        function toggleCart()   { document.querySelector('.cart-sidebar')?.classList.toggle('open'); document.querySelector('.cart-overlay')?.classList.toggle('open'); }
        updateCartBadge();

        // ── API fetch wrapper ─────────────────────────────────────────
        async function apiFetch(url, options = {}) {
            if (isLoggedIn()) {
                options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + getToken() });
            }
            const res = await fetch(url, options);
            if (res.status === 401) { logout(); return null; }
            return res;
        }
    </script>
</div>
</html>
